<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心画测评H5｜旅程解读</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/ios-device.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/xinhua.css" />
    <link rel="stylesheet" href="../css/journey.css" />
  </head>
  <body class="app-body">
    <div class="ios-device">
      <div class="ios-device__shell">
        <div class="ios-device__screen">
          <div class="ios-status-bar">
            <span class="ios-status-bar__time">9:41</span>
            <span class="ios-status-bar__island"></span>
            <span class="ios-status-bar__icons" aria-hidden="true">···</span>
          </div>
          <div class="phone-frame">
            <main class="app-scroll jh-result-page">
              <nav class="xh-nav">
                <a href="entry.html" aria-label="回入口">‹</a>
                <h1>旅程解读</h1>
              </nav>

              <div
                class="jh-result-hero"
                style="background-image:url('../assets/journey/journey-scene-camp-sign.png')"
              >
                <div class="jh-result-hero__copy">
                  <strong>旅途暂歇 · 路标解读</strong>
                  <span>先看模型串联出的完整旅程图，再看探索性解读。反馈仅供自我觉察。</span>
                </div>
              </div>

              <section class="jh-result-compose">
                <!-- 模式类型 patternId 仅写入进度/智能体数据，不对用户展示名称 -->
                <p class="xh-pattern-headline" id="jh-name" hidden aria-hidden="true"></p>
                <p class="xh-hint" style="margin:0 0 10px;padding:0 14px">模型串联的完整旅程图（只读）</p>
                <img id="jh-compose-img" alt="模型生成的完整旅程图" />
                <p id="jh-desc"></p>
              </section>

              <p class="jh-symbol-hint">
                象征提示（探索假设，非标准答案）：猴子≈重要他人 · 小鸟≈孩子/脆弱部分 · 背包≈责任 · 蛇≈财富/安全感
              </p>

              <section class="xh-result-block">
                <h3>常见安排</h3>
                <p id="jh-arrange"></p>
                <h3>可能的积极面</h3>
                <p id="jh-positive"></p>
                <h3>需要觉察</h3>
                <p id="jh-watch"></p>
                <h3>开放式反馈</h3>
                <p id="jh-feedback"></p>
                <p class="xh-hint">反馈仅供自我观察与关系觉察，不作为心理诊断、人格定型或家庭关系评定依据。</p>
              </section>

              <div class="xh-footer" style="display:flex;gap:10px;flex-wrap:wrap">
                <button type="button" class="xh-btn" id="h5-share">分享转发</button>
                <button type="button" class="xh-btn xh-btn--ghost" id="h5-retest">重新测试</button>
              </div>
            </main>
            <div class="ios-home-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/device.js"></script>
    <script src="../js/journey-patterns.js"></script>
    <script src="js/h5-auth.js"></script>
    <script src="js/h5-progress.js"></script>
    <script src="js/journey-result.js"></script>
  </body>
</html>
