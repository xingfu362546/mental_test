<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心画测评H5｜登录</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/ios-device.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/xinhua.css" />
    <link rel="stylesheet" href="../css/journey.css" />
  </head>
  <body class="app-body">
    <div class="ios-device">
      <div class="ios-device__shell">
        <div class="ios-device__screen">
          <div class="ios-status-bar">
            <span class="ios-status-bar__time">9:41</span>
            <span class="ios-status-bar__island"></span>
            <span class="ios-status-bar__icons" aria-hidden="true">···</span>
          </div>
          <div class="phone-frame">
            <main class="app-scroll" style="padding:24px 18px">
              <nav class="xh-nav">
                <span aria-hidden="true"></span>
                <h1>登录</h1>
              </nav>
              <p class="jh-lead" style="margin-top:12px">
                <strong>心画测评 · 人生旅程</strong><br />
                正式环境将通过小程序授权手机号登录。本页为演示用假授权。
              </p>
              <section class="jh-panel" style="margin-top:20px">
                <button type="button" class="xh-btn" id="h5-login-btn" style="width:100%">
                  微信授权手机号
                </button>
                <p class="xh-hint" style="margin-top:12px">
                  演示将写入本地会话（138****0000），便于续测分流。
                </p>
              </section>
            </main>
            <div class="ios-home-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/device.js"></script>
    <script src="js/h5-auth.js"></script>
    <script src="js/h5-login.js"></script>
  </body>
</html>
