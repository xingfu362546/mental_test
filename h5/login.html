<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微信授权手机号</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/ios-device.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="css/h5-auth.css" />
  </head>
  <body class="app-body">
    <div class="ios-device">
      <div class="ios-device__shell">
        <div class="ios-device__screen">
          <div class="ios-status-bar">
            <span class="ios-status-bar__time">9:41</span>
            <span class="ios-status-bar__island"></span>
            <span class="ios-status-bar__icons" aria-hidden="true">···</span>
          </div>
          <div class="phone-frame wx-auth-frame">
            <!-- 对齐微信小程序「手机号快速验证」授权页结构，不展示假手机号 -->
            <main class="wx-auth" role="dialog" aria-labelledby="wx-auth-title">
              <header class="wx-auth__brand">
                <span class="wx-auth__logo" aria-hidden="true">微</span>
                <span class="wx-auth__brand-name">微信</span>
              </header>

              <h1 class="wx-auth__title" id="wx-auth-title">手机号快速验证</h1>
              <p class="wx-auth__app">心画测评申请使用</p>

              <section class="wx-auth__card">
                <p class="wx-auth__label">微信绑定号码</p>
                <p class="wx-auth__phone-placeholder">授权后由微信提供</p>
                <button type="button" class="wx-auth__other" id="h5-login-other" disabled>
                  使用其他号码
                </button>
              </section>

              <p class="wx-auth__privacy">
                授权后，微信将把你的手机号提供给「心画测评」，用于登录核验与测评进度保存。详情见
                <a href="#" class="wx-auth__link" id="h5-privacy">隐私保护指引</a>
              </p>

              <div class="wx-auth__actions">
                <button type="button" class="wx-auth__allow" id="h5-login-allow">允许</button>
                <button type="button" class="wx-auth__deny" id="h5-login-deny">拒绝</button>
              </div>
            </main>
            <div class="ios-home-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/device.js"></script>
    <script src="js/h5-auth.js"></script>
    <script src="js/h5-login.js"></script>
  </body>
</html>
